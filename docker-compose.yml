version: '3.8'

services:
  kidsvidedu:
    build: .
    container_name: kidsvidedu_studio
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - MOHIRAI_API_KEY=${MOHIRAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/presets"]
      interval: 30s
      timeout: 10s
      retries: 3
